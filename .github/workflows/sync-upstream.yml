name: Sync Upstream (Open WebUI)

on:
  # Se ejecuta automáticamente cada lunes a las 9 AM
  schedule:
    - cron: '0 9 * * 1' # Ajusta la frecuencia según necesites

  # Permite ejecución manual desde GitHub Actions
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para tener todo el historial
          token: ${{ secrets.MY_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/open-webui/open-webui.git || true
          git fetch upstream

      - name: Create backup branch
        run: |
          BACKUP_BRANCH="backup-before-sync-$(date +%Y%m%d-%H%M%S)"
          git branch $BACKUP_BRANCH
          echo "BACKUP_BRANCH=$BACKUP_BRANCH" >> $GITHUB_ENV
          echo "✅ Backup creado: $BACKUP_BRANCH"

      - name: Attempt merge from upstream
        id: merge
        continue-on-error: true
        run: |
          # Obtener la última versión tag del upstream
          LATEST_TAG=$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || echo "upstream/main")
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

          # Intentar merge
          git merge upstream/main --no-edit -m "chore: Sync with upstream $LATEST_TAG

          Automated sync from open-webui/open-webui

          🤖 Generated by GitHub Actions"

      - name: Check merge status
        id: check
        run: |
          if git diff --quiet HEAD; then
            echo "status=no-changes" >> $GITHUB_OUTPUT
            echo "ℹ️ No hay cambios nuevos en upstream"
          elif git diff --name-only --diff-filter=U | grep -q .; then
            echo "status=conflict" >> $GITHUB_OUTPUT
            echo "⚠️ Hay conflictos que requieren resolución manual"
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ Merge exitoso sin conflictos"
          fi

      - name: Push successful merge
        if: steps.check.outputs.status == 'success'
        run: |
          git push origin main
          echo "✅ Cambios pusheados automáticamente"

      - name: Create conflict resolution branch
        if: steps.check.outputs.status == 'conflict'
        run: |
          CONFLICT_BRANCH="sync-upstream-conflicts-$(date +%Y%m%d)"
          git checkout -b $CONFLICT_BRANCH

          # Listar archivos con conflictos
          echo "## 📋 Archivos con conflictos:" > conflict-report.md
          git diff --name-only --diff-filter=U >> conflict-report.md

          echo "CONFLICT_BRANCH=$CONFLICT_BRANCH" >> $GITHUB_ENV

          # Abortar el merge para crear PR limpio
          git merge --abort

          # Crear rama con información
          git checkout -b $CONFLICT_BRANCH

          # Crear archivo con instrucciones
          cat > SYNC_INSTRUCTIONS.md << 'EOF'
          # 🔄 Sync Upstream - Conflictos Detectados

          Este PR fue creado automáticamente porque se detectaron conflictos al intentar
          sincronizar con el repositorio upstream de Open WebUI.

          ## 📋 Archivos con conflictos

          Revisa los archivos listados en `conflict-report.md`

          ## 🛠️ Cómo resolver

          1. Clona este branch localmente:
             ```bash
             git fetch origin
             git checkout $CONFLICT_BRANCH
             ```

          2. Intenta el merge manualmente:
             ```bash
             git merge upstream/main
             ```

          3. Resuelve los conflictos en los archivos indicados

          4. Completa el merge:
             ```bash
             git add .
             git commit -m "Resolve conflicts from upstream sync"
             git push origin $CONFLICT_BRANCH
             ```

          5. Mergea este PR cuando esté listo

          ## 🔙 Backup

          Se creó un backup en la rama: `$BACKUP_BRANCH`

          Si algo sale mal, puedes volver a esa rama.
          EOF

          git add SYNC_INSTRUCTIONS.md conflict-report.md
          git commit -m "docs: Add conflict resolution instructions"
          git push origin $CONFLICT_BRANCH

      - name: Create Pull Request for conflicts
        if: steps.check.outputs.status == 'conflict'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.MY_TOKEN }}
          branch: ${{ env.CONFLICT_BRANCH }}
          title: '⚠️ Sync Upstream - Conflictos Detectados'
          body: |
            ## 🔄 Actualización Automática del Upstream

            Se intentó sincronizar con el repositorio oficial de Open WebUI pero se
            encontraron **conflictos** que requieren resolución manual.

            ### 📊 Información

            - **Versión upstream**: `${{ env.LATEST_TAG }}`
            - **Backup creado**: `${{ env.BACKUP_BRANCH }}`
            - **Fecha**: $(date)

            ### 🛠️ Siguiente paso

            Revisa el archivo `SYNC_INSTRUCTIONS.md` en este PR para ver las
            instrucciones detalladas de cómo resolver los conflictos.

            ### ⚠️ Archivos afectados

            Los archivos con conflictos están listados en `conflict-report.md`

            ---

            🤖 Este PR fue creado automáticamente por GitHub Actions
          labels: sync-upstream, needs-review

      - name: Notify success
        if: steps.check.outputs.status == 'success'
        run: |
          echo "✅ Sync completado exitosamente!"
          echo "📦 Versión: ${{ env.LATEST_TAG }}"
          echo "🔙 Backup disponible en: ${{ env.BACKUP_BRANCH }}"

      - name: Notify no changes
        if: steps.check.outputs.status == 'no-changes'
        run: |
          echo "ℹ️ Tu fork ya está actualizado con upstream"
